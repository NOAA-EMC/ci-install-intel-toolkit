name: 'CI: Test ci-install-intel-toolkit action'

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  schedule:
  - cron: '0 0 25 * *'

jobs:
  test-classic-compilers:
    name: Test Classic
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Classic compilers only available in 2023.x
        version: ['2023.2.1']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify no Intel compilers pre-installed
        run: bash ci/verify-no-intel-compilers.sh
      
      - name: Install Intel Classic compilers
        uses: ./
        env:
          RUNNER_DEBUG: '1'
        with:
          install-classic: true
          classic-version: ${{ matrix.version }}
          install-oneapi: true
          oneapi-version: 2025.3
          compiler-setup: 'classic'
          env-update: true
          cache: false
      
      - name: Verify debug output
        uses: ./ci/verify-debug-output
      
      - name: Verify Classic compilers
        run: bash ci/verify-classic-compilers.sh
      
      - name: Test Classic C compilation
        run: |
          icc -v ci/hello.c -o test_c
          output=$(./test_c)
          echo "$output"
          echo "$output" | grep -q "Hello from Intel C compiler"
      
      - name: Test Classic C++ compilation
        run: |
          icpc -v ci/hello.cpp -o test_cpp
          output=$(./test_cpp)
          echo "$output"
          echo "$output" | grep -q "Hello from Intel C++ compiler"
      
      - name: Test Classic Fortran compilation
        run: |
          ifort -v ci/hello.f90 -o test_f90
          output=$(./test_f90)
          echo "$output"
          echo "$output" | grep -q "Hello from Intel Fortran compiler"

  test-oneapi-versions:
    name: Test oneAPI
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - version: '2023.2.1'
            fortran-compiler: 'ifx'
          - version: '2023.2.1'
            fortran-compiler: 'ifort'
          - version: '2025.3'
            fortran-compiler: 'ifx'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify no Intel compilers pre-installed
        run: bash ci/verify-no-intel-compilers.sh
      
      - name: Install Intel oneAPI compilers
        uses: ./
        env:
          RUNNER_DEBUG: '1'
        with:
          install-classic: true
          install-oneapi: true
          oneapi-version: ${{ matrix.version }}
          oneapi-fortran-compiler: ${{ matrix.fortran-compiler }}
          compiler-setup: 'oneapi'
          env-update: true
          cache: false
      
      - name: Verify debug output
        uses: ./ci/verify-debug-output
      
      - name: Verify oneAPI compilers
        run: bash ci/verify-oneapi-compilers.sh ${{ matrix.fortran-compiler }}
      
      - name: Test oneAPI C compilation
        run: |
          icx -v ci/hello.c -o test_c
          output=$(./test_c)
          echo "$output"
          echo "$output" | grep -q "Hello from Intel C compiler"
      
      - name: Test oneAPI C++ compilation
        run: |
          icpx -v ci/hello.cpp -o test_cpp
          output=$(./test_cpp)
          echo "$output"
          echo "$output" | grep -q "Hello from Intel C++ compiler"
      
      - name: Test oneAPI Fortran compilation
        run: |
          $FC -v ci/hello.f90 -o test_f90
          output=$(./test_f90)
          echo "$output"
          echo "$output" | grep -q "Hello from Intel Fortran compiler"

  test-mpi-configurations:
    name: MPI ${{ matrix.mpi-version }} with ${{ matrix.compiler-type }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler-version: '2025.3'
            compiler-type: 'oneapi'
            mpi-version: '2021.10.0'
            mpi-wrapper: 'oneapi'
          - compiler-version: '2023.2.1'
            compiler-type: 'classic'
            mpi-version: '2021.10.0'
            mpi-wrapper: 'classic'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify no Intel compilers pre-installed
        run: bash ci/verify-no-intel-compilers.sh
      
      - name: Install Intel compilers with MPI
        uses: ./
        with:
          install-classic: ${{ matrix.compiler-type == 'classic' }}
          classic-version: ${{ matrix.compiler-version }}
          install-oneapi: ${{ matrix.compiler-type == 'oneapi' }}
          oneapi-version: ${{ matrix.compiler-version }}
          install-mpi: true
          mpi-version: ${{ matrix.mpi-version }}
          mpi-wrapper-setup: ${{ matrix.mpi-wrapper }}
          env-update: true
          cache: false
      
      - name: Verify MPI installation
        run: bash ci/verify-mpi.sh ${{ matrix.compiler-type }}
      
      - name: Test MPI C compilation and execution
        run: |
          $CC ci/mpi_hello.c -o mpi_test_c
          output=$(mpirun -n 2 ./mpi_test_c)
          echo "$output"
          rank0_count=$(echo "$output" | grep -c "Hello from MPI rank 0 of 2")
          rank1_count=$(echo "$output" | grep -c "Hello from MPI rank 1 of 2")
          [ "$rank0_count" -eq 1 ] || { echo "ERROR: Rank 0 output appeared $rank0_count times (expected 1)"; exit 1; }
          [ "$rank1_count" -eq 1 ] || { echo "ERROR: Rank 1 output appeared $rank1_count times (expected 1)"; exit 1; }
      
      - name: Test MPI Fortran compilation and execution
        run: |
          $FC ci/mpi_hello.f90 -o mpi_test_f90
          output=$(mpirun -n 2 ./mpi_test_f90)
          echo "$output"
          rank0_count=$(echo "$output" | grep -c "Hello from MPI rank.*0.*of.*2")
          rank1_count=$(echo "$output" | grep -c "Hello from MPI rank.*1.*of.*2")
          [ "$rank0_count" -eq 1 ] || { echo "ERROR: Rank 0 output appeared $rank0_count times (expected 1)"; exit 1; }
          [ "$rank1_count" -eq 1 ] || { echo "ERROR: Rank 1 output appeared $rank1_count times (expected 1)"; exit 1; }

  test-openmp:
    name: OpenMP
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify no Intel compilers pre-installed
        run: bash ci/verify-no-intel-compilers.sh
      
      - name: Install Intel compilers
        uses: ./
        with:
          install-oneapi: true
          oneapi-version: '2023.2.1'
          install-openmp: true
          openmp-version: '2023.2.1'
          compiler-setup: 'oneapi'
          env-update: true
          cache: false
      
      - name: Test OpenMP C compilation
        run: |
          icx -qopenmp ci/openmp_test.c -o openmp_test_c
          export OMP_NUM_THREADS=4
          output=$(./openmp_test_c)
          echo "$output"
          for thread in 0 1 2 3; do
            count=$(echo "$output" | grep -c "Hello from OpenMP thread $thread of 4")
            [ "$count" -eq 1 ] || { echo "ERROR: Thread $thread output appeared $count times (expected 1)"; exit 1; }
          done
      
      - name: Test OpenMP Fortran compilation
        run: |
          ifx -qopenmp ci/openmp_test.f90 -o openmp_test_f90
          export OMP_NUM_THREADS=4
          output=$(./openmp_test_f90)
          echo "$output"
          for thread in 0 1 2 3; do
            count=$(echo "$output" | grep -c "Hello from OpenMP thread.*$thread.*of.*4")
            [ "$count" -eq 1 ] || { echo "ERROR: Thread $thread output appeared $count times (expected 1)"; exit 1; }
          done

  test-mkl:
    name: MKL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Verify no Intel compilers pre-installed
        run: bash ci/verify-no-intel-compilers.sh
      
      - name: Install Intel compilers
        uses: ./
        with:
          install-oneapi: true
          oneapi-version: '2025.3'
          install-mkl: true
          mkl-version: '2025.3'
          compiler-setup: 'oneapi'
          env-update: true
          cache: false
      
      - name: Test MKL with C
        run: |
          icx ci/mkl_test.c -o mkl_test_c -lmkl_intel_lp64 -lmkl_sequential -lmkl_core -lpthread -lm -ldl
          output=$(./mkl_test_c)
          echo "$output"
          echo "$output" | grep -q "MKL BLAS test call successful"
      
      - name: Test MKL with Fortran
        run: |
          ifx ci/mkl_test.f90 -o mkl_test_f90 -lmkl_intel_lp64 -lmkl_sequential -lmkl_core -lpthread -lm -ldl
          output=$(./mkl_test_f90)
          echo "$output"
          echo "$output" | grep -q "MKL BLAS Fortran test call successful"